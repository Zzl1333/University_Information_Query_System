<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高校管理 - 高校专业数据分析平台</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!--    <link rel="stylesheet" href="../static/css/admin_style.css">-->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_style.css') }}">
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">
    <header class="admin-header flex justify-between items-center px-6 py-4 fixed w-full top-0">
        <div class="flex items-center">
            <i class="fas fa-user-shield text-2xl mr-3"></i>
            <h1 class="text-2xl font-bold">高校专业数据分析平台 - 管理后台</h1>
        </div>
        <div>
            <a href="/admin/logout" class="text-white hover:text-gray-300 transition-colors duration-200">
                <i class="fas fa-sign-out-alt mr-2"></i>退出登录
            </a>
        </div>
    </header>

    <div class="flex flex-1 mt-16">
        <aside class="admin-sidebar w-64 p-4">
            <nav>
                <div class="nav-item active" data-module="系统概览">  <!-- 修改这里：系统概览默认高亮 -->
                <i class="fas fa-tachometer-alt mr-3 text-xl"></i>系统概览
                </div>
                <div class="nav-item" data-module="高校管理">  <!-- 修改这里：移除高校管理的active类 -->
                    <i class="fas fa-university mr-3 text-xl"></i>高校管理
                </div>
                <div class="nav-item" data-module="用户管理">
                    <i class="fas fa-users mr-3 text-xl"></i>用户管理
                </div>
                <div class="nav-item" data-module="系统设置">
                    <i class="fas fa-cog mr-3 text-xl"></i>系统设置
                </div>
            </nav>
        </aside>

        <main class="admin-content flex-1 p-8">
            <div id="dynamicContent" class="bg-white rounded-lg shadow-md p-8">
                </div>
        </main>
    </div>

    <div id="addUniversityModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
            <div class="flex justify-between items-center px-6 py-4 border-b">
                <h3 class="text-xl font-bold text-gray-800">添加新高校</h3>
                <button id="closeAddModal" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="addUniversityForm">
            <div class="p-6">
                <div class="mb-4">
                    <label for="newUniversityName" class="block text-gray-700 text-sm font-bold mb-2">高校名称</label>
                    <input type="text" id="newUniversityName" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
            </div>
            <div class="flex justify-end px-6 py-4 border-t">
                <button type="button" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded mr-2" onclick="closeModal('addUniversityModal')">
                    取消
                </button>
                <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    提交爬取
                </button>
            </div>
        </form>
    </div>
</div>



    <div id="editUniversityModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
            <div class="flex justify-between items-center px-6 py-4 border-b">
                <h3 class="text-xl font-bold text-gray-800">编辑高校信息</h3>
                <button id="closeEditModal" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="editUniversityForm">
                <div class="p-6">
                    <input type="hidden" id="editUniversityId"> <div class="mb-4">
                        <label for="editUniversityName" class="block text-gray-700 text-sm font-bold mb-2">高校名称</label>
                        <input type="text" id="editUniversityName" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required readonly> </div>
                    <div class="mb-4">
                        <label for="editUniversityProvince" class="block text-gray-700 text-sm font-bold mb-2">所在省份</label>
                        <select id="editUniversityProvince" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                            <option value="">选择省份</option>
                            <option value="北京市">北京市</option>
                            <option value="天津市">天津市</option>
                            <option value="上海市">上海市</option>
                            <option value="重庆市">重庆市</option>
                            <option value="河北省">河北省</option>
                            <option value="山西省">山西省</option>
                            <option value="辽宁省">辽宁省</option>
                            <option value="吉林省">吉林省</option>
                            <option value="黑龙江省">黑龙江省</option>
                            <option value="江苏省">江苏省</option>
                            <option value="浙江省">浙江省</option>
                            <option value="安徽省">安徽省</option>
                            <option value="福建省">福建省</option>
                            <option value="江西省">江西省</option>
                            <option value="山东省">山东省</option>
                            <option value="河南省">河南省</option>
                            <option value="湖北省">湖北省</option>
                            <option value="湖南省">湖南省</option>
                            <option value="广东省">广东省</option>
                            <option value="海南省">海南省</option>
                            <option value="四川省">四川省</option>
                            <option value="贵州省">贵州省</option>
                            <option value="云南省">云南省</option>
                            <option value="陕西省">陕西省</option>
                            <option value="甘肃省">甘肃省</option>
                            <option value="青海省">青海省</option>
                            <option value="台湾省">台湾省</option>
                            <option value="内蒙古自治区">内蒙古自治区</option>
                            <option value="广西壮族自治区">广西壮族自治区</option>
                            <option value="西藏自治区">西藏自治区</option>
                            <option value="宁夏回族自治区">宁夏回族自治区</option>
                            <option value="新疆维吾尔自治区">新疆维吾尔自治区</option>
                            <option value="香港特别行政区">香港特别行政区</option>
                            <option value="澳门特别行政区">澳门特别行政区</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="editUniversityRank" class="block text-gray-700 text-sm font-bold mb-2">高校排名</label>
                        <input type="number" id="editUniversityRank" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" min="1">
                    </div>
                    <div class="flex items-center mb-4">
                        <input type="checkbox" id="editIsActive" class="mr-2">
                        <label for="editIsActive" class="text-gray-700 text-sm">启用该高校</label>
                    </div>
                </div>
                <div class="flex justify-end px-6 py-4 border-t">
                    <button type="button" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded mr-2" onclick="closeModal('editUniversityModal')">
                        取消
                    </button>
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                        更新信息
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="deleteConfirmModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
            <div class="flex justify-between items-center px-6 py-4 border-b">
                <h3 class="text-xl font-bold text-gray-800">确认删除</h3>
                <button id="closeDeleteModal" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6">
                <input type="hidden" id="deleteUniversityId"> <div class="flex items-center mb-4">
                    <div class="bg-red-100 p-3 rounded-full mr-4">
                        <i class="fas fa-exclamation-triangle text-red-500 text-2xl"></i>
                    </div>
                    <div>
                        <p class="font-medium">确定要删除该高校吗？</p>
                        <p class="text-gray-600 mt-1">此操作将永久删除高校记录且无法恢复！</p>
                    </div>
                </div>
                <div class="bg-yellow-50 p-4 rounded-lg mt-4">
                    <p class="text-sm text-yellow-700"><i class="fas fa-info-circle mr-2"></i>删除高校将同时删除其所有专业数据，请谨慎操作。</p>
                </div>
            </div>
            <div class="flex justify-end px-6 py-4 border-t">
                <button type="button" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded mr-2" onclick="closeModal('deleteConfirmModal')">
                    取消
                </button>
                <button type="button" id="confirmDeleteBtn" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                    确认删除
                </button>
            </div>
        </div>
    </div>

<!--    <script src="../static/js/admin_script.js"></script>-->
    <script src="{{ url_for('static', filename='js/admin_script.js') }}"></script>

    <!-- 在文件末尾的模态框部分添加以下代码 -->
<div id="addUserModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
        <div class="flex justify-between items-center px-6 py-4 border-b">
            <h3 class="text-xl font-bold text-gray-800">添加新用户</h3>
            <button id="closeAddUserModal" class="text-gray-400 hover:text-gray-600">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <form id="addUserForm">
            <div class="p-6">
                <div class="mb-4">
                    <label for="newUserId" class="block text-gray-700 text-sm font-bold mb-2">用户ID</label>
                    <input type="text" id="newUserId" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                <div class="mb-4">
                    <label for="newUserName" class="block text-gray-700 text-sm font-bold mb-2">用户名</label>
                    <input type="text" id="newUserName" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                <div class="mb-4">
                    <label for="newUserEmail" class="block text-gray-700 text-sm font-bold mb-2">邮箱</label>
                    <input type="email" id="newUserEmail" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                <div class="mb-4">
                    <label for="newUserRole" class="block text-gray-700 text-sm font-bold mb-2">角色</label>
                    <select id="newUserRole" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                        <option value="普通用户">普通用户</option>
                        <option value="管理员">管理员</option>
                        <option value="超级管理员">超级管理员</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="newUserPassword" class="block text-gray-700 text-sm font-bold mb-2">密码</label>
                    <input type="password" id="newUserPassword" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
            </div>
            <div class="flex justify-end px-6 py-4 border-t">
                <button type="button" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded mr-2" onclick="closeModal('addUserModal')">
                    取消
                </button>
                <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    添加用户
                </button>
            </div>
        </form>
    </div>
</div>

<div id="editUserModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
        <div class="flex justify-between items-center px-6 py-4 border-b">
            <h3 class="text-xl font-bold text-gray-800">编辑用户信息</h3>
            <button id="closeEditUserModal" class="text-gray-400 hover:text-gray-600">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <form id="editUserForm">
            <div class="p-6">
                <input type="hidden" id="editUserId">
                <div class="mb-4">
                    <label for="editUserIdField" class="block text-gray-700 text-sm font-bold mb-2">用户ID</label>
                    <input type="text" id="editUserIdField" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" readonly>
                </div>
                <div class="mb-4">
                    <label for="editUserName" class="block text-gray-700 text-sm font-bold mb-2">用户名</label>
                    <input type="text" id="editUserName" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                <div class="mb-4">
                    <label for="editUserEmail" class="block text-gray-700 text-sm font-bold mb-2">邮箱</label>
                    <input type="email" id="editUserEmail" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                <div class="mb-4">
                    <label for="editUserRole" class="block text-gray-700 text-sm font-bold mb-2">角色</label>
                    <select id="editUserRole" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                        <option value="普通用户">普通用户</option>
                        <option value="管理员">管理员</option>
                        <option value="超级管理员">超级管理员</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="editUserPassword" class="block text-gray-700 text-sm font-bold mb-2">密码</label>
                    <input type="password" id="editUserPassword" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="留空则不修改">
                </div>
            </div>
            <div class="flex justify-end px-6 py-4 border-t">
                <button type="button" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded mr-2" onclick="closeModal('editUserModal')">
                    取消
                </button>
                <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    更新信息
                </button>
            </div>
        </form>
    </div>
</div>


</body>
</html>
